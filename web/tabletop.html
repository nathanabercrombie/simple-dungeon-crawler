<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1d18">
  <title>Card Table · Delvekeeper</title>
  <link rel="stylesheet" href="tabletop.css?build=20261126.1">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="index.html"><span aria-hidden="true">◇</span> Delvekeeper</a>
    <h1>Card Table</h1>
    <a class="guided" href="index.html">← Guided play</a>
  </header>
  <main class="table">
    <div class="table-info">
      <p>Tap or drag from a deck. Tap a loose card before dragging to move it; drag elsewhere to pan. Use <strong>Pull cards</strong> to open a Scene sleeve.</p>
      <span id="count"></span>
    </div>
    <div id="felt" class="felt" aria-label="Card table surface">
      <div id="world" class="world">
        <button type="button" id="deck" class="deck" data-deck="scene" title="Drag or click to draw a Scene sleeve"></button>
        <div id="character-decks" class="character-decks" role="group" aria-label="Character decks"></div>
        <div id="cards" class="cards"></div>
      </div>
    </div>
    <footer class="controls">
      <div class="control-group" aria-label="Deck controls" role="group">
        <label class="sr-only" for="draw-deck">Deck to draw from or shuffle</label>
        <select id="draw-deck"></select>
        <button type="button" data-action="draw">Draw</button>
        <button type="button" data-action="shuffle">Shuffle deck</button>
        <button type="button" data-action="reset">New table</button>
      </div>
      <div class="control-group card-controls" aria-label="Selected card controls" role="group">
        <button type="button" data-action="flip" title="Flip selected card (F)">Flip <kbd>F</kbd></button>
        <button type="button" data-action="rotate-back" title="Rotate 90° counterclockwise (Shift+R)" aria-label="Rotate selected card 90 degrees counterclockwise">↶</button>
        <button type="button" data-action="rotate" title="Rotate 90° clockwise (R)" aria-label="Rotate selected card 90 degrees clockwise">↷</button>
        <button type="button" data-action="open" title="Open the selected sleeve (E)">Open sleeve</button>
        <button type="button" data-action="undo" title="Undo last move or card action (Ctrl+Z)">Undo</button>
      </div>
      <div class="control-group" aria-label="Table view controls" role="group">
        <button type="button" data-action="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" data-action="fit" title="Bring all the cards into view">Fit</button>
      </div>
      <p id="status" class="sr-only" role="status"></p>
    </footer>
  </main>
  <script src="data.js?build=20261126.3"></script>
  <script src="tabletop.js?build=20261126.3"></script>
</body>
</html>
